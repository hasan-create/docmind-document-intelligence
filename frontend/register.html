<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocMind AI - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>DocMind AI</h1>

            <p class="subtitle">
                Create your account
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="password2"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Register
                </button>

            </form>


            <p
                id="errorMessage"
                class="error-message"
            ></p>


            <p class="switch-auth">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
