<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocMind AI - Login</title>
    <meta name="description" content="AI-Powered Document Intelligence & Retrieval System using RAG and Gemini">
    <meta property="og:title" content="DocMind AI">
    <meta property="og:description" content="AI-Powered Document Intelligence & Retrieval System using RAG and Gemini">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>DocMind AI</h1>

            <p class="subtitle">
                Chat with your documents using AI
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>


            <p id="errorMessage" class="error-message"></p>


            <p class="switch-auth">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
